[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Show detailed output
addopts =
    -v
    --tb=short
    --strict-markers

# Custom markers
markers =
    slow: marks tests as slow (deselect with -m "not slow")
    integration: marks tests that require external data or services
    notebook: marks tests that test Jupyter notebooks

# Minimum version
minversion = 7.0

# Log level during tests
log_cli = false
log_level = WARNING

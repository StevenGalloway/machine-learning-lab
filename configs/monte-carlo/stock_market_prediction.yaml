# =============================================================================
# Stock Market Prediction — Monte Carlo Configuration
# =============================================================================
# All values here are the source of truth for default run parameters.
# CLI arguments override these values at runtime.
# Weights are equal-weighted and computed dynamically from the ticker count.
# =============================================================================

# --- Portfolio -----------------------------------------------------------------
tickers:
  - AAPL
  - MSFT
  - NVDA
  - AMZN
  - GOOGL

# --- Market data ---------------------------------------------------------------
lookback_period: "3y"       # yfinance period string: 1y, 2y, 3y, 5y, max
interval: "1d"              # yfinance interval: 1d, 1wk
cache_ttl_hours: 24         # hours before cached price data is considered stale
trading_days_per_year: 252  # US equity markets: ~252 trading days per year
risk_free_rate: 0.0         # annualized risk-free rate for Sharpe-style calculations

# --- Simulation ----------------------------------------------------------------
forecast_days: 252          # trading days to simulate forward (approx 1 year)
num_paths: 5000             # number of Monte Carlo paths
seed: 123                   # random seed for reproducibility
